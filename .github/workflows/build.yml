name: Build FrenchIPMasker .exe

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build executable
        run: |
          pyinstaller --onefile --windowed --name FrenchIPMasker `
            --add-data "tor_manager.py;." `
            --add-data "proxy_scraper.py;." `
            --add-data "network.py;." `
            --hidden-import customtkinter `
            --hidden-import requests `
            --hidden-import stem `
            --hidden-import PIL `
            --clean `
            main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FrenchIPMasker
          path: dist/FrenchIPMasker.exe

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          files: dist/FrenchIPMasker.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
